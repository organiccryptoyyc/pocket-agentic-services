# brand-protection backend for ONE network ({{NETWORK}}), in Pocket Service
# Manager's layout. Each network is a separate deployment (own container,
# image, data volume and ingest token), so Beta can run new code while MainNet
# stays untouched. Generated by ops/package-psm.js; don't edit the copy.
#
# PSM: deploy_ship this folder as "{{DEPLOY_ID}}", supplier_run deploy
# "{{DEPLOY_ID}}" (health /v1/health), then on the {{NETWORK}} stack add-service
# brand-protection -> http://{{DEPLOY_ID}}-backend:8080.
#
# Certificate Transparency follower (package-psm.js --ct): a second container
# from the same image that follows one CT shard per operator and writes hits to
# the shared data volume; the Pi reads them via GET /ingest/ct-hits. About
# 15 GB/day of download. Only one network runs it (MainNet; Beta for testing).
#
# Ingest token: filled in by ops/package-psm.js from .secrets/<network>-ingest.env
# (gitignored), so it exists only in this generated copy and on the server.

services:
  backend:
    build: ../backend
    image: {{DEPLOY_ID}}-backend:latest
    container_name: {{DEPLOY_ID}}-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      BP_NETWORK: {{NETWORK}}
      BP_DEPLOY_STAMP: "{{DEPLOY_STAMP}}"
      BP_INGEST_HOST: 0.0.0.0
      BP_INGEST_PORT: "8090"
      BP_INGEST_TOKEN: "{{INGEST_TOKEN}}"
      BP_MAX_WATCHED: "200"
    volumes:
      - brand-protection-data:/var/lib/brand-protection
    expose:
      - "8080"
      - "8090"
    mem_limit: 256m
    networks: [supplier]
{{CT_SERVICE}}
volumes:
  brand-protection-data:

networks:
  supplier:
    external: true
    name: pocket-supplier
