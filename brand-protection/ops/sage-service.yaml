# SAGE gateway configuration for brand-protection. Send to the Pocket partner channel with the
# listing request. Gateways do NOT read the service card; without this entry SAGE refuses REST
# requests for the service and it is not discoverable on agent.pocket.network.
# type generic is SAGE's name for passthrough (PSM 0.1.30+ writes it this way).
gateway_config:
  services:
    - id: brand-protection
      type: generic
      rpc_types: ["rest"]
      timeout_config:
        relay_timeout: 15s        # stored reports are file reads; a quick DNS scan is bounded to about 9 s
  active_health_checks:
    local:
      - service_id: brand-protection
        enabled: true
        checks:
          - name: version
            type: rest
            method: GET
            path: /v1/version
            expected_status_code: 200
            reputation_signal: critical_error
            timeout: 5s
          - name: health
            type: rest
            method: GET
            path: /v1/health
            expected_status_code: 200
            reputation_signal: major_error
            timeout: 5s
        # No sync_check / sync_allowance: not a blockchain service.
