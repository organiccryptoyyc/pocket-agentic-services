# SAGE gateway configuration for treasury-capital-score. Publish with the
# service docs / send to the Pocket partner channel. Gateways do NOT read the
# service card; without this entry SAGE refuses REST requests for the service
# with a 400 and it is not discoverable on agent.pocket.network.
gateway_config:
  services:
    - id: treasury-capital-score
      type: passthrough
      rpc_types: ["rest"]
      timeout_config:
        relay_timeout: 15s        # relay path is a cache read; 15s is generous
  active_health_checks:
    local:
      - service_id: treasury-capital-score
        enabled: true
        checks:
          - name: version
            type: rest
            method: GET
            path: /v1/version
            expected_status_code: 200
            reputation_signal: critical_error
            timeout: 5s
          - name: health
            type: rest
            method: GET
            path: /v1/health
            expected_status_code: 200
            reputation_signal: major_error
            timeout: 5s
        # No sync_check / sync_allowance: not a blockchain service.
