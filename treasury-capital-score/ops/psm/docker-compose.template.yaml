# treasury-capital-score backend for ONE network ({{NETWORK}}), in Pocket Service
# Manager's layout. Each network is a separate deployment (own container, image,
# data volume, pipeline, and ingest token), so Beta can run new code while
# MainNet stays untouched. Generated by ops/package-psm.js; don't edit the copy.
#
# PSM: deploy_ship this folder as "{{DEPLOY_ID}}", supplier_run deploy
# "{{DEPLOY_ID}}" (health /v1/health), then on the {{NETWORK}} stack add-service
# treasury-capital-score -> http://{{DEPLOY_ID}}-backend:8080.
#
# Ingest token: filled in by ops/package-psm.js from .secrets/<network>-ingest.env
# (gitignored), so it exists only in this generated copy and on the server.

services:
  backend:
    build: ../backend
    image: {{DEPLOY_ID}}-backend:latest
    container_name: {{DEPLOY_ID}}-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      TCS6_NETWORK: {{NETWORK}}
      TCS6_INGEST_HOST: 0.0.0.0
      TCS6_INGEST_PORT: "8090"
      TCS6_INGEST_TOKEN: "{{INGEST_TOKEN}}"
    volumes:
      - tcs6-data:/var/lib/tcs6
    expose:
      - "8080"
      - "8090"
    networks: [supplier]

  pipeline:
    image: {{DEPLOY_ID}}-backend:latest
    container_name: {{DEPLOY_ID}}-pipeline
    restart: unless-stopped
    command: ["node", "pipeline/run.js", "--loop"]
    environment:
      TCS6_NETWORK: {{NETWORK}}
      TCS6_DEPLOY_STAMP: "{{DEPLOY_STAMP}}"   # changes every package, so each deploy rescored immediately
      TCS6_PIPELINE_INTERVAL_HOURS: "12"
      TCS6_MAX_EVIDENCE_AGE_HOURS: "24"
    volumes:
      - tcs6-data:/var/lib/tcs6
    depends_on: [backend]
    networks: [supplier]

volumes:
  tcs6-data:

networks:
  supplier:
    external: true
    name: pocket-supplier
