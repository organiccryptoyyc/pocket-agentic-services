# PMIC hub in Pocket Service Manager's layout, on the Pocket server next to the RelayMiner.
# Generated by ops/package-psm.js; don't edit the copy.
#
# The hub fetches nothing itself. The Pi pushes to its ingest listener (8091, exposed through
# the PSM route /pmic-ingest, prefix stripped) and the service packs read its query API over the
# pocket-supplier network at http://pmic-hub-backend:8080. It is never a RelayMiner backend.
#
# PSM: deploy_ship this folder as "pmic-hub", supplier_run deploy "pmic-hub" (health /v1/health),
# then add-routes /pmic-ingest -> 8091. No add-service and no stake: nothing here touches the chain.
#
# Tokens: filled in by ops/package-psm.js from .secrets/hub.env (gitignored), so they exist only
# in this generated copy, on the server, and (ingest token) in the Pi's .env.

services:
  backend:
    build: ../backend
    image: pmic-hub-backend:latest
    container_name: pmic-hub-backend
    restart: unless-stopped
    command: ["node", "server.js"]
    environment:
      PORT: "8080"
      PMIC_INGEST_HOST: 0.0.0.0
      PMIC_INGEST_PORT: "8091"
      PMIC_INGEST_TOKEN: "{{INGEST_TOKEN}}"
      PMIC_API_TOKEN: "{{API_TOKEN}}"
    volumes:
      - pmic-hub-data:/var/lib/pmic
    expose:
      - "8080"
      - "8091"
    networks: [supplier]

  # The hub prunes and backs up on its own schedule (the Pi's maintenance does not replicate).
  maintenance:
    image: pmic-hub-backend:latest
    container_name: pmic-hub-maintenance
    restart: unless-stopped
    entrypoint: ["sh", "-c", "while true; do node bin/collect.js --maintain; sleep 86400; done"]
    volumes:
      - pmic-hub-data:/var/lib/pmic
    depends_on: [backend]
    networks: [supplier]

volumes:
  pmic-hub-data:

networks:
  supplier:
    external: true
    name: pocket-supplier
