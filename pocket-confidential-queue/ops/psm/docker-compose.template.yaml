# pocket-confidential-queue for ONE network ({{NETWORK}}), PSM layout. Generated by
# ops/package-psm.js; don't edit the copy. The job token is filled in from
# .secrets/<network>-job.env (gitignored) and also goes into the Liskov job as the
# CONFIDENTIAL_QUEUE_TOKEN secret. Port 8080: public API (RelayMiner, later). Port 8090:
# job API, reached only through the private route {{ROUTE}}. Port 8091: peer API (witness
# task sets from our own backends), on the internal Docker network only: no route, no host port.
services:
  backend:
    build: ../backend
    image: {{DEPLOY_ID}}-backend:latest
    container_name: {{DEPLOY_ID}}-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      CQ_JOB_PORT: "8090"
      CQ_PEER_PORT: "8091"
      CQ_JOB_TOKEN: "{{JOB_TOKEN}}"
      CQ_NETWORK: {{NETWORK}}
      CQ_DEPLOY_STAMP: "{{DEPLOY_STAMP}}"
    volumes:
      - cq-data:/var/lib/pocket-confidential-queue
    expose: ["8080", "8090", "8091"]
    mem_limit: 384m   # 0.5.0: the screening-list refresh parses two ~30 MB public files
    networks: [supplier]

volumes:
  cq-data:

networks:
  supplier:
    external: true
    name: pocket-supplier
