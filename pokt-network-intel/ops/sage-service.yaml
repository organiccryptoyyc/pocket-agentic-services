# SAGE gateway configuration for pokt-network-intel. Gateways do NOT read the service card;
# without this entry SAGE refuses REST requests for the service with a 400.
gateway_config:
  services:
    - id: pokt-network-intel
      type: passthrough
      rpc_types: ["rest"]
      timeout_config:
        relay_timeout: 20s        # backend: 8s per upstream call, one retry
  active_health_checks:
    local:
      - service_id: pokt-network-intel
        enabled: true
        checks:
          - name: version
            type: rest
            method: GET
            path: /v1/version
            expected_status_code: 200
            reputation_signal: critical_error
            timeout: 5s
          - name: health
            type: rest
            method: GET
            path: /v1/health
            expected_status_code: 200
            reputation_signal: major_error
            timeout: 5s
        # No sync_check / sync_allowance: not a blockchain service.
