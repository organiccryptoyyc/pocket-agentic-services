# pokt-network-intel backend for ONE network ({{NETWORK}}), in Pocket Service Manager's layout.
# Generated by ops/package-psm.js; don't edit the copy.
#
# PSM: deploy_ship this folder as "{{DEPLOY_ID}}", supplier_run deploy "{{DEPLOY_ID}}" (health
# /v1/health), then on the {{NETWORK}} stack add-service pokt-network-intel -> http://{{DEPLOY_ID}}-backend:8080.
# No keys or state: the only setting that matters is POCKET_NETWORK, which must be {{NETWORK}}.

services:
  backend:
    build: ../backend
    image: {{DEPLOY_ID}}-backend:latest
    container_name: {{DEPLOY_ID}}-backend
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PORT: "8080"
      POCKET_NETWORK: {{NETWORK}}
    expose:
      - "8080"
    networks: [supplier]

networks:
  supplier:
    external: true
    name: pocket-supplier
