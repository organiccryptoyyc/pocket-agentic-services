# x402-feed for ONE network ({{NETWORK}}), PSM layout. Generated by ops/package-psm.js;
# don't edit the copy. The token comes from %USERPROFILE%\.x402-feed\{{NETWORK}}.env on the
# PC (outside every repo) and is the same value alpha1 sends as FEED_TOKEN.
# Port 8080: health (PSM deploy check). Port 8095: the feed, published as {{ROUTE}}.
# Not a Pocket service: no add-service, no relayer entry, no card.
services:
  backend:
    build: ../backend
    image: {{DEPLOY_ID}}-backend:latest
    container_name: {{DEPLOY_ID}}-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      FEED_PORT: "8095"
      FEED_NETWORK: {{NETWORK}}
      FEED_TOKEN: "{{FEED_TOKEN}}"
    expose: ["8080", "8095"]
    mem_limit: 96m
    read_only: true
    networks: [supplier]

networks:
  supplier:
    external: true
    name: pocket-supplier
