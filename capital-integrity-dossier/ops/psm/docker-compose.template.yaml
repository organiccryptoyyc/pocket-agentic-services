# capital-integrity-dossier backend for ONE network ({{NETWORK}}), in Pocket Service Manager's layout.
# Generated by ops/package-psm.js; don't edit the copy.
#
# PSM: deploy_ship this folder as "{{DEPLOY_ID}}", supplier_run deploy "{{DEPLOY_ID}}" (health /v1/health),
# then on the {{NETWORK}} stack add-service capital-integrity-dossier -> http://{{DEPLOY_ID}}-backend:8080.
#
# Reads the {{NETWORK}} TCS-6 data volume ({{TCS6_VOLUME}}) READ-ONLY: the dossier never writes TCS-6 data,
# never calls a chain or a vendor, and has no ingest listener and no secrets.

services:
  backend:
    build: ../backend
    image: {{DEPLOY_ID}}-backend:latest
    container_name: {{DEPLOY_ID}}-backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      DOSSIER_NETWORK: {{NETWORK}}
      DOSSIER_TCS6_DATA_DIR: /var/lib/tcs6
      DOSSIER_DATA_DIR: /var/lib/dossier
    volumes:
      - tcs6-data:/var/lib/tcs6:ro
      - dossier-data:/var/lib/dossier
    expose:
      - "8080"
    networks: [supplier]

volumes:
  tcs6-data:
    external: true
    name: {{TCS6_VOLUME}}
  dossier-data:

networks:
  supplier:
    external: true
    name: pocket-supplier
